<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Variational OI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--bg:#071113;--pn:#0c1b1e;--pn2:#10252a;--ln:#1b3439;--fg:#e6f4f1;--fg2:#b9cfcb;--mu:#86a6a3;--mint:#5eead4;--up:#4ade80;--dn:#f87171;--am:#fbbf24;--or:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:15px;-webkit-text-size-adjust:100%}
a{color:var(--mint)}
.wrap{max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;min-width:0}
.k{font-size:13px;color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.title{font-size:20px;font-weight:700}
.nav{display:inline-block;border:1px solid var(--ln);background:var(--pn2);border-radius:999px;padding:7px 14px;font-size:14px;text-decoration:none;color:var(--fg)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--up)}
.live.off i{background:var(--dn)}
/* 지금 할 일 */
.todo{border-left:6px solid var(--up);padding:18px 20px}
.todo.s-am{border-left-color:var(--am)}.todo.s-or{border-left-color:var(--or)}.todo.s-dn{border-left-color:var(--dn)}
.todo h2{margin:0;font-size:22px;line-height:1.35}
.todo .do{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.todo .do div{font-size:18px;font-weight:600;background:var(--pn2);border-radius:10px;padding:10px 14px}
.todo .why{margin-top:10px;font-size:14px;color:var(--fg2);line-height:1.5}
/* 숫자 타일 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:600px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;min-width:0}
.tile .v{font-size:26px;font-weight:700;margin-top:4px;white-space:nowrap}
/* 짝 카드 */
.pair{display:flex;flex-direction:column;gap:12px;border-left:6px solid var(--up)}
.pair.s-am{border-left-color:var(--am)}.pair.s-or{border-left-color:var(--or)}.pair.s-dn{border-left-color:var(--dn)}
.ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph .n{font-size:18px;font-weight:700}
.chip{font-size:14px;font-weight:700;border-radius:999px;padding:3px 12px;margin-left:auto}
.chip.up{background:rgba(74,222,128,.13);color:var(--up)}.chip.am{background:rgba(251,191,36,.15);color:var(--am)}.chip.or{background:rgba(251,146,60,.16);color:var(--or)}.chip.dn{background:rgba(248,113,113,.16);color:var(--dn)}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big .now{font-size:30px;font-weight:700}
.big .mv{font-size:18px;font-weight:600}
.left{font-size:15px;color:var(--fg2)}
.left b{color:var(--fg)}
.gauge svg{display:block;width:100%;height:auto}
.accts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:10px}
.acct{background:var(--pn2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.acct .h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.acct .nm{font-weight:700;font-size:16px}
.acct .pl{font-size:16px;font-weight:700}
.meter{height:8px;border-radius:4px;background:#0a1416;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--am)}
.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--am)}.or{color:var(--or)}.mu{color:var(--mu)}
.chart svg{display:block;width:100%;height:auto}
.foot{font-size:13px;color:var(--mu);line-height:1.6}
</style>
</head>
<body>
<div class="wrap">

  <section class="top">
    <div>
      <div class="title">Variational OI</div>
      <span class="live" id="live"><i></i><span id="live-t">가격 불러오는 중…</span></span>
    </div>
  </section>

  <section class="pn todo" id="todo"><h2>불러오는 중…</h2></section>

  <section class="tiles" id="tiles"></section>

  <div id="pairs" style="display:flex;flex-direction:column;gap:14px"></div>

  <section class="pn">
    <div class="ph" style="margin-bottom:8px"><span class="n">가격차 추이</span><span class="k" id="hist-k"></span></div>
    <div class="k" style="margin-bottom:4px">원유 BZ − CL</div>
    <div class="chart" id="c-oil"></div>
    <div id="gs-wrap"><div class="k" style="margin:10px 0 4px">금 ÷ 은</div>
    <div class="chart" id="c-gs"></div></div>
  </section>

  <section class="foot" id="foot"></section>
</div>

<script>
const VAR_URL = 'https://omni-client-api.prod.ap-northeast-1.variational.io/metadata/v2/stats';
const HL = 'https://api.hyperliquid.xyz/info';
const XYZ = {'CL-PERP': 'xyz:CL', 'BZ-PERP': 'xyz:BRENTOIL', 'XAU-PERP': 'xyz:GOLD', 'XAG-PERP': 'xyz:SILVER', 'GOOGL-PERP': 'xyz:GOOGL'};
const NEED = ['CL-PERP', 'BZ-PERP'];  // 페어 계산에 꼭 필요한 가격
// 단계: 여유 소진율 기준 (알림 스크립트와 같음 + 미리 보기 단계 25%)
const LV = [{f: 0, k: 'up', t: '안전'}, {f: .25, k: 'am', t: '곧 입금'}, {f: .35, k: 'or', t: '입금'}, {f: .55, k: 'dn', t: '지금 입금'}, {f: .75, k: 'dn', t: '비상'}];
const lvOf = c => { let r = LV[0]; LV.forEach(l => { if (c >= l.f) r = l; }); return r; };
const C = {up: '#4ade80', am: '#fbbf24', or: '#fb923c', dn: '#f87171', mu: '#86a6a3', mint: '#5eead4'};
const usd = v => v == null || isNaN(v) ? '—' : (v < 0 ? '−$' : '$') + d3.format(',.0f')(Math.abs(v));
const usdS = v => (v >= 0 ? '+' : '−') + '$' + d3.format(',.0f')(Math.abs(v));
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

let P = null, hist = [], px = {}, src = '', pxAt = null;

async function getJSON(u, opt) { const r = await fetch(u, opt); if (!r.ok) throw new Error(r.status); return r.json(); }
async function loadPositions() { try { P = await getJSON('data/positions.json?' + Date.now()); } catch (e) { P = null; } }
async function loadHist() {
  try {
    const r = await fetch('data/pair_marks.csv?' + Date.now()); if (!r.ok) throw 0;
    hist = d3.csvParse(await r.text(), d => ({t: new Date(d.time_utc), CL: +d.CL || null, BZ: +d.BZ || null, XAU: +d.XAU || null, XAG: +d.XAG || null, src: d.src}));
  } catch (e) { hist = []; }
}
// 가격: Variational 직접 → 5분 기록(15분 이내) → 하이퍼리퀴드
async function loadPrices() {
  try {
    const d = await getJSON(VAR_URL), o = {};
    (d.listings || []).forEach(l => { if (XYZ[l.ticker]) o[l.ticker] = +l.mark_price; });
    if (NEED.every(k => o[k])) { px = o; src = 'Variational 실시간'; pxAt = new Date(); return; }
  } catch (e) {}
  const last = hist[hist.length - 1];
  if (last && Date.now() - last.t < 15 * 60000 && last.src !== 'hyperliquid' && last.CL && last.BZ) {
    px = {'CL-PERP': last.CL, 'BZ-PERP': last.BZ, 'XAU-PERP': last.XAU, 'XAG-PERP': last.XAG}; src = 'Variational 5분 기록'; pxAt = last.t; return;
  }
  try {
    const m = await getJSON(HL, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({type: 'allMids', dex: 'xyz'})});
    const o = {}; Object.entries(XYZ).forEach(([k, v]) => { if (m[v]) o[k] = +m[v]; });
    px = o; src = '하이퍼리퀴드 (Variational과 몇 센트 차이)'; pxAt = new Date();
  } catch (e) { src = ''; }
}

// 계정 계산: 위험은 두 다리의 '차이'뿐. 여유 소진율 = 처음 여유(현금−유지증거금) 중 써버린 비율
function account(name) {
  const m = P.accounts[name], legs = P.positions.filter(p => p.account === name);
  const by = Object.fromEntries(legs.map(l => [l.instrument, l]));
  const oil = !!by['CL-PERP'];
  const pnl = d3.sum(legs, l => (l.side === 'long' ? 1 : -1) * l.qty * ((px[l.instrument] ?? l.entry) - l.entry));
  const oi = d3.sum(legs, l => l.qty * (px[l.instrument] ?? l.entry));
  const mm0 = m.mm_rate * d3.sum(legs, l => l.qty * l.entry), mm = m.mm_rate * oi;
  const buf0 = m.cash - mm0, equity = m.cash + pnl;
  const consumed = 1 - (equity - mm) / buf0;
  // 가격차(원유) 또는 비율(금/은)로 바꾼 기준선
  let entry, cur, unit, lossUp;
  if (oil) {
    entry = by['BZ-PERP'].entry - by['CL-PERP'].entry; cur = px['BZ-PERP'] - px['CL-PERP'];
    unit = buf0 / by['CL-PERP'].qty;              // 가격차 $1당 여유 = q
    lossUp = by['CL-PERP'].side === 'long';         // CL 롱이면 가격차가 벌어질 때 손해
  } else {
    entry = by['XAU-PERP'].entry / by['XAG-PERP'].entry; cur = px['XAU-PERP'] / px['XAG-PERP'];
    unit = entry * buf0 / (by['XAU-PERP'].qty * by['XAU-PERP'].entry);  // 비율 이동 = 여유
    lossUp = by['XAU-PERP'].side === 'short';       // 금 숏이면 비율이 오를 때 손해
  }
  const at = f => lossUp ? entry + f * unit : entry - f * unit;   // 소진 f가 되는 가격차/비율
  const solo = legs.filter(l => !['CL-PERP', 'BZ-PERP', 'XAU-PERP', 'XAG-PERP'].includes(l.instrument));
  return {name, m, legs, by, oil, pnl, oi, equity, consumed, entry, cur, at, lossUp, buf0, solo,
    side: oil ? `CL ${by['CL-PERP'].side === 'long' ? '롱' : '숏'} · BZ ${by['BZ-PERP'].side === 'long' ? '롱' : '숏'} ${by['CL-PERP'].qty}`
              : `금 ${by['XAU-PERP'].side === 'long' ? '롱' : '숏'} ${by['XAU-PERP'].qty} · 은 ${by['XAG-PERP'].side === 'long' ? '롱' : '숏'} ${by['XAG-PERP'].qty}`};
}

function pairs() {
  const ids = [...new Set(Object.values(P.accounts).map(a => a.pair))].sort();
  return ids.map(id => {
    const A = Object.keys(P.accounts).filter(n => P.accounts[n].pair === id).map(account);
    const oil = A[0].oil;
    const up = A.filter(a => a.lossUp), dn = A.filter(a => !a.lossUp);
    const nearUp = f => d3.min(up, a => a.at(f)), nearDn = f => d3.max(dn, a => a.at(f));
    const entry = d3.mean(A, a => a.entry), cur = A[0].cur;
    const worst = A.reduce((w, a) => a.consumed > w.consumed ? a : w, A[0]);
    return {id, name: (P.pairs || {})[id] || '', A, oil, entry, cur, nearUp, nearDn, worst};
  });
}

// 입금 제안: 계정 간 이동 없이 지갑 예비금 → 손해 계정. 여유 소진을 10%까지 되돌리는 금액
function transfers(pr) {
  return pr.A.filter(a => a.consumed >= .35).map(a => ({to: a.name, amt: Math.ceil(Math.max(0, (a.consumed - .10) * a.buf0) / 10) * 10, lv: lvOf(a.consumed)}));
}

const fmtV = (oil, v) => oil ? '$' + v.toFixed(2) : v.toFixed(2);

function render() {
  if (!P || !P.positions || !P.positions.length) { document.getElementById('todo').innerHTML = '<h2>열린 포지션이 없어요</h2>'; return; }
  const live = document.getElementById('live');
  live.className = 'live' + (src ? '' : ' off');
  document.getElementById('live-t').textContent = src ? `${src} · ${d3.timeFormat('%H:%M')(pxAt)}` : '가격을 못 불러왔어요';
  if (!NEED.every(k => px[k])) return;
  const PR = pairs(), all = PR.flatMap(p => p.A);

  // 지금 할 일
  const tx = PR.flatMap(transfers), worst = all.reduce((w, a) => a.consumed > w.consumed ? a : w, all[0]);
  const wl = lvOf(worst.consumed), todo = document.getElementById('todo');
  todo.className = 'pn todo s-' + wl.k; todo.textContent = '';
  if (tx.length) {
    todo.appendChild(el('h2', null, worst.consumed >= .55 ? '🔴 지금 바로 입금하세요' : '🟠 예비금을 넣을 때가 됐어요'));
    const d = el('div', 'do'); tx.forEach(t => d.appendChild(el('div', null, `예비금 → ${t.to}  ${usd(t.amt)} 입금`))); todo.appendChild(d);
    todo.appendChild(el('div', 'why', `${worst.name} 계정이 청산 여유의 ${d3.format('.0%')(worst.consumed)}를 썼어요. 넣으면 여유 소진이 10%로 돌아와요. 넣은 뒤엔 알려주세요 (기록 갱신).`));
  } else {
    // 가장 가까운 송금 기준까지 남은 거리
    const nxt = PR.map(p => { const a = p.A.reduce((w, x) => x.consumed > w.consumed ? x : w, p.A[0]); return {p, a, trig: a.at(.35)}; })
      .sort((x, y) => y.a.consumed - x.a.consumed)[0];
    const gap = Math.abs(nxt.trig - nxt.p.cur), gapTxt = nxt.p.oil ? '$' + gap.toFixed(2) : gap.toFixed(2);
    todo.appendChild(el('h2', null, worst.consumed >= .25 ? `🟡 곧 입금해야 해요 — ${worst.name}` : '✅ 지금은 할 일 없어요'));
    todo.appendChild(el('div', 'why', `가장 가까운 입금 기준: 짝 ${nxt.p.id} ${nxt.p.oil ? '가격차' : '금÷은'}가 ${fmtV(nxt.p.oil, nxt.trig)}에 닿으면 (지금 ${fmtV(nxt.p.oil, nxt.p.cur)}, ${gapTxt} 남음) → 예비금을 ${nxt.a.name}에 입금`));
  }

  // 타일
  const tiles = document.getElementById('tiles'); tiles.textContent = '';
  [['총 OI', usd(d3.sum(all, a => a.oi)), ''], ['총 자산', usd(d3.sum(all, a => a.equity)), ''], ['지갑 예비금', usd(P.reserve_usd), ''], ['가장 위험한 계정', d3.format('.0%')(Math.max(0, worst.consumed)), wl.k]]
    .forEach(([k, v, c]) => { const t = el('div', 'tile'); t.append(el('div', 'k', k), el('div', 'v ' + c, v)); if (k === '가장 위험한 계정') t.appendChild(el('div', 'k', worst.name + ' · 여유 소진율')); tiles.appendChild(t); });

  // 짝 카드
  const box = document.getElementById('pairs'); box.textContent = '';
  PR.forEach(p => {
    const l = lvOf(p.worst.consumed), c = el('section', 'pn pair s-' + l.k);
    const h = el('div', 'ph'); h.append(el('span', 'n', `짝 ${p.id} · ${p.oil ? '원유' : '금/은'}`), el('span', 'k', p.name), el('span', 'chip ' + l.k, l.t)); c.appendChild(h);
    const mv = p.cur - p.entry;
    const big = el('div', 'big');
    big.append(el('span', 'k', p.oil ? '가격차 BZ−CL' : '금 ÷ 은'), el('span', 'now', fmtV(p.oil, p.cur) + (p.oil ? ` · ${d3.format('.1%')(p.cur / px['CL-PERP'])}` : '')),
      el('span', 'mv ' + (Math.abs(mv) < (p.oil ? 1 : 0.01 * p.entry) ? 'mu' : 'am'), `진입 ${fmtV(p.oil, p.entry)} 대비 ${mv >= 0 ? '+' : '−'}${p.oil ? '$' + Math.abs(mv).toFixed(2) : Math.abs(mv).toFixed(2) + ` (${d3.format('+.1%')(mv / p.entry)})`}`));
    c.appendChild(big);
    c.appendChild(gauge(p));
    const sU = p.nearUp(.35), sD = p.nearDn(.35);
    const gapTxt = g => g <= 0 ? '이미 넘음' : fmtV(p.oil, g) + ' 남음';
    c.appendChild(el('div', 'left', `입금 기준까지  위로 ${gapTxt(sU - p.cur)}  ·  아래로 ${gapTxt(p.cur - sD)}`));
    const ac = el('div', 'accts');
    p.A.forEach(a => {
      const al = lvOf(a.consumed), d = el('div', 'acct');
      const hh = el('div', 'h'); hh.append(el('span', 'nm', a.name), el('span', 'pl ' + (a.pnl >= 0 ? 'up' : 'dn'), usdS(a.pnl))); d.appendChild(hh);
      d.appendChild(el('div', 'k', `${a.side} · ${p.oil ? (a.lossUp ? '가격차 ↑ 손해' : '가격차 ↓ 손해') : (a.lossUp ? '비율 ↑ 손해' : '비율 ↓ 손해')}`));
      const mt = el('div', 'meter'), fi = el('i'), mk = el('b'); fi.style.width = Math.min(100, Math.max(0, a.consumed) * 100) + '%'; fi.style.background = C[al.k]; mk.style.left = '35%'; mt.append(fi, mk); d.appendChild(mt);
      d.appendChild(el('div', 'k', `여유 소진 ${d3.format('.0%')(Math.max(0, a.consumed))} · 자산 ${usd(a.equity)} · ${(a.oi / a.equity).toFixed(1)}배`));
      a.solo.forEach(l => { const pl = (l.side === 'long' ? 1 : -1) * l.qty * ((px[l.instrument] ?? l.entry) - l.entry); d.appendChild(el('div', 'k', `＋ ${l.instrument.replace('-PERP', '')} ${l.side === 'long' ? '롱' : '숏'} ${l.qty} (헷지 없음) · ${usdS(pl)}`)); });
      ac.appendChild(d);
    });
    c.appendChild(ac); box.appendChild(c);
  });

  charts(PR);
  document.getElementById('foot').innerHTML = `포지션 기준 ${P.updated} · SL/TP 없이 운영 — 위험은 두 다리의 가격 '차이'뿐이라 그 차이로만 판단해요.<br>여유 소진율 = 처음 청산 여유 중 써버린 비율. 25% 곧 입금 · 35% 입금(텔레그램 알림) · 55% 지금 입금 · 100% 청산. 입금은 지갑 예비금에서, 넣은 뒤엔 기록 갱신이 필요해요.`;
}

// 게이지: 가운데 진입값, 양 끝 청산. 구간 색 = 안전/곧/송금/지금 송금
function gauge(p) {
  const W = Math.max(320, (document.getElementById('pairs').clientWidth || 640) - 40), H = 92, m = 22, lo = p.nearDn(1), hi = p.nearUp(1);
  const x = d3.scaleLinear().domain([lo, hi]).range([m, W - m]).clamp(true);
  const svg = d3.create('svg').attr('viewBox', `0 0 ${W} ${H}`);
  const seg = [[lo, p.nearDn(.55), C.dn], [p.nearDn(.55), p.nearDn(.35), C.or], [p.nearDn(.35), p.nearDn(.25), C.am], [p.nearDn(.25), p.nearUp(.25), C.up], [p.nearUp(.25), p.nearUp(.35), C.am], [p.nearUp(.35), p.nearUp(.55), C.or], [p.nearUp(.55), hi, C.dn]];
  seg.forEach(([a, b, col]) => svg.append('rect').attr('x', x(a)).attr('y', 34).attr('width', Math.max(0, x(b) - x(a))).attr('height', 12).attr('fill', col).attr('opacity', .55));
  const tick = (v, label, y, anchor) => { svg.append('line').attr('x1', x(v)).attr('x2', x(v)).attr('y1', 30).attr('y2', 50).attr('stroke', '#e6f4f1').attr('opacity', .5); svg.append('text').attr('x', x(v)).attr('y', y).attr('text-anchor', anchor || 'middle').attr('fill', '#b9cfcb').attr('font-size', 13).text(label); };
  tick(lo, '청산 ' + fmtV(p.oil, lo), 68, 'start'); tick(hi, '청산 ' + fmtV(p.oil, hi), 68, 'end');
  tick(p.nearDn(.35), '입금 ' + fmtV(p.oil, p.nearDn(.35)), 84, W < 480 ? 'end' : 'middle'); tick(p.nearUp(.35), '입금 ' + fmtV(p.oil, p.nearUp(.35)), 84, W < 480 ? 'start' : 'middle');
  svg.append('line').attr('x1', x(p.entry)).attr('x2', x(p.entry)).attr('y1', 28).attr('y2', 52).attr('stroke', '#e6f4f1').attr('stroke-dasharray', '3 2');
  tick(p.entry, '진입', 68);
  const cx = x(p.cur);
  svg.append('path').attr('d', `M${cx - 9},8 L${cx + 9},8 L${cx},26 Z`).attr('fill', '#e6f4f1');
  svg.append('circle').attr('cx', cx).attr('cy', 40).attr('r', 7).attr('fill', '#e6f4f1').attr('stroke', '#0c1b1e').attr('stroke-width', 2);
  const g = el('div', 'gauge'); g.appendChild(svg.node()); return g;
}

function charts(PR) {
  const D = hist.map(d => ({t: d.t, oil: d.BZ && d.CL ? d.BZ - d.CL : null, gs: d.XAU && d.XAG ? d.XAU / d.XAG : null}));
  if (src === 'Variational 실시간') D.push({t: pxAt, oil: px['BZ-PERP'] - px['CL-PERP'], gs: px['XAU-PERP'] / px['XAG-PERP']});
  document.getElementById('gs-wrap').style.display = PR.some(q => !q.oil) ? '' : 'none';
  document.getElementById('hist-k').textContent = hist.length ? `Variational 가격 5분 기록 · ${hist.length}개` : '5분마다 기록이 쌓여요';
  [['c-oil', 'oil'], ['c-gs', 'gs']].forEach(([id, key]) => {
    const p = PR.find(q => (key === 'oil') === q.oil), box = document.getElementById(id); box.textContent = '';
    const pts = D.filter(d => d[key] != null && isFinite(d[key]));
    if (!p || pts.length < 2) { box.appendChild(el('div', 'k', '기록이 아직 부족해요')); return; }
    const W = Math.max(320, box.clientWidth || 640), H = 170, m = {t: 8, r: 50, b: 22, l: 30};
    const lines = [[p.entry, '#86a6a3', '3 3', '진입'], [p.nearUp(.35), C.or, '6 4', '입금'], [p.nearDn(.35), C.or, '6 4', '입금']];
    const vals = pts.map(d => d[key]).concat(lines.map(l => l[0]));
    const x = d3.scaleTime().domain(d3.extent(pts, d => d.t)).range([m.l, W - m.r]);
    const y = d3.scaleLinear().domain(d3.extent(vals)).nice().range([H - m.b, m.t]);
    const svg = d3.create('svg').attr('viewBox', `0 0 ${W} ${H}`);
    svg.append('g').attr('transform', `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(5).tickFormat(d3.timeFormat('%m/%d %H시'))).call(g => { g.select('.domain').attr('stroke', '#1b3439'); g.selectAll('line').remove(); g.selectAll('text').attr('fill', '#86a6a3').attr('font-size', 12); });
    lines.forEach(([v, col, dash, lab]) => { svg.append('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', y(v)).attr('y2', y(v)).attr('stroke', col).attr('stroke-dasharray', dash); svg.append('text').attr('x', W - m.r + 4).attr('y', y(v) + 4).attr('fill', col).attr('font-size', 12).text(lab); });
    svg.append('path').datum(pts).attr('fill', 'none').attr('stroke', C.mint).attr('stroke-width', 2).attr('d', d3.line().x(d => x(d.t)).y(d => y(d[key])));
    const last = pts[pts.length - 1];
    svg.append('circle').attr('cx', x(last.t)).attr('cy', y(last[key])).attr('r', 4).attr('fill', C.mint);
    box.appendChild(svg.node());
  });
}

async function tick() { await loadPrices(); render(); }
(async () => {
  await Promise.all([loadPositions(), loadHist()]);
  await tick();
  setInterval(tick, 20000);
  setInterval(async () => { await Promise.all([loadPositions(), loadHist()]); render(); }, 5 * 60000);
})();
</script>
