name: entropy-record

on:
  schedule:
    - cron: "17,47 * * * *"   # 30분마다 가격·펀딩·계정 증거금 기록 (주소는 저장 안 함)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: entropy-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record
        env:
          ENTROPY_ACCOUNTS: ${{ secrets.ENTROPY_ACCOUNTS }}
        run: python scripts/entropy_monitor.py --record
      - name: Commit data
        run: |
          git config user.name "funding-bot"
          git config user.email "funding-bot@users.noreply.github.com"
          git add data/entropy_history.json
          if ! git diff --cached --quiet; then
            git commit -m "entropy $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
