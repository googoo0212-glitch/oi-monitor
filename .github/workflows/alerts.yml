name: price-alerts

on:
  schedule:
    - cron: "*/5 * * * *"    # 5분마다 (GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-alerts
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SL/TP/liquidation distance
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_alerts.py
      - name: Save alert state
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add data/alert_state.json
          if ! git diff --cached --quiet; then
            git commit -m "alert state $(date -u +%H:%MZ)"
            git pull --rebase
            git push
          fi
